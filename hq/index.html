<style>
:root{
  --ink:#05060A;--card:rgba(14,16,26,.66);--card2:rgba(21,24,38,.82);
  --line:rgba(243,241,234,.07);--line2:rgba(243,241,234,.13);
  --paper:#F3F1EA;--dim:#9BA0B4;--faint:#5F6478;
  --blue:#6E88FF;--blue2:#4259D9;--blue3:#A9B8FF;--mint:#3DDC97;--pink:#FF6AD5;--amber:#F5B544;--red:#FF5A5F;--violet:#A78BFA;
  --ease:cubic-bezier(.2,.7,.15,1);--spring:cubic-bezier(.34,1.56,.64,1);--r:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ink);color-scheme:dark}
body{font-family:'Archivo',system-ui,sans-serif;color:var(--paper);background:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
::selection{background:var(--blue);color:var(--ink)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(243,241,234,.1);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
.num{font-variant-numeric:tabular-nums}

/* ── living background: aurora blobs + dot grid + grain ── */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;will-change:transform}
.bg i:nth-child(1){width:46vw;height:46vw;left:58%;top:-22%;background:radial-gradient(circle,#4259D9,transparent 65%);animation:drift1 26s ease-in-out infinite alternate}
.bg i:nth-child(2){width:40vw;height:40vw;left:-14%;top:55%;background:radial-gradient(circle,#2B3A9E,transparent 65%);animation:drift2 32s ease-in-out infinite alternate}
.bg i:nth-child(3){width:30vw;height:30vw;left:35%;top:40%;background:radial-gradient(circle,rgba(61,220,151,.45),transparent 65%);opacity:.18;animation:drift3 38s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(-14vw,10vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(18vw,-14vh) scale(1.2)}}
@keyframes drift3{to{transform:translate(-10vw,-18vh) scale(.85)}}
.bg::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(243,241,234,.07) 1px,transparent 1.3px);background-size:26px 26px;-webkit-mask-image:radial-gradient(75% 65% at 55% 35%,#000,transparent)}
.bg::after{content:"";position:absolute;inset:-50%;opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain 1.4s steps(5) infinite}
@keyframes grain{20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}}

/* ── intro ── */
#intro{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:var(--ink);cursor:pointer}
#intro.on{display:grid}
#intro .in{display:flex;flex-direction:column;align-items:center}
#intro svg{width:120px;height:120px;overflow:visible}
#intro .seg{transform-box:fill-box;transform-origin:center;opacity:0;animation:segIn .7s var(--spring) forwards}
#intro .seg:nth-child(1){--tx:-70px;--ty:-60px;--r:-40deg;animation-delay:.05s}
#intro .seg:nth-child(2){--tx:80px;--ty:-40px;--r:50deg;animation-delay:.15s}
#intro .seg:nth-child(3){--tx:60px;--ty:20px;--r:-30deg;animation-delay:.25s}
#intro .seg:nth-child(4){--tx:-80px;--ty:40px;--r:40deg;animation-delay:.35s}
#intro .seg:nth-child(5){--tx:40px;--ty:80px;--r:-50deg;animation-delay:.45s}
@keyframes segIn{from{opacity:0;transform:translate(var(--tx),var(--ty)) rotate(var(--r)) scale(.4)}to{opacity:1;transform:none}}
#intro .glow{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(110,136,255,.55),transparent 65%);filter:blur(20px);opacity:0;animation:pulseIn 1.2s .6s ease-out forwards}
@keyframes pulseIn{40%{opacity:1;transform:scale(1.1)}to{opacity:.35;transform:scale(1)}}
#intro h1{margin-top:28px;font-size:34px;letter-spacing:.32em;font-weight:700;padding-left:.32em;opacity:0;animation:fadeUp .6s .75s var(--ease) forwards}
#intro h1 b{color:var(--blue)}
#intro p{margin-top:10px;font-size:11px;letter-spacing:.5em;color:var(--faint);opacity:0;animation:fadeUp .6s .9s var(--ease) forwards}
#intro .load{margin-top:30px;width:220px;height:2px;border-radius:2px;background:rgba(243,241,234,.08);overflow:hidden;opacity:0;animation:fadeUp .4s .9s forwards}
#intro .load i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue2),var(--blue),var(--mint));box-shadow:0 0 12px var(--blue);transition:width .5s var(--ease)}
#intro.out{animation:introOut .7s var(--ease) forwards}
@keyframes introOut{to{opacity:0;transform:scale(1.06);filter:blur(6px);visibility:hidden}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── login ── */
#login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px}
#login .box{position:relative;width:min(420px,100%);padding:40px 34px 30px;border-radius:30px;background:var(--card);border:1px solid var(--line2);backdrop-filter:blur(22px);box-shadow:0 50px 140px -30px rgba(0,0,0,.9);text-align:center;animation:fadeUp .7s var(--ease)}
#login .box::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:conic-gradient(from var(--a,0deg),transparent 0 70%,var(--blue) 85%,var(--mint) 95%,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 5s linear infinite}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
#login svg.mark{width:68px;height:68px;filter:drop-shadow(0 8px 30px rgba(110,136,255,.6));animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
#login h1{margin-top:18px;font-size:30px;letter-spacing:-.03em}
#login h1 span{color:var(--blue)}
#login p{margin-top:8px;color:var(--dim);font-size:14px}
#login input{margin-top:24px;width:100%;padding:15px 16px;border-radius:14px;border:1px solid var(--line2);background:rgba(0,0,0,.35);font-size:15px;outline:none;text-align:center;letter-spacing:.06em;transition:border-color .2s,box-shadow .2s}
#login input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(110,136,255,.18)}
#login .go{margin-top:12px;width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--blue2));font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 12px 30px -10px rgba(110,136,255,.8);transition:transform .15s}
#login .go:active{transform:scale(.98)}
#login .err{margin-top:12px;color:var(--red);font-size:13px;min-height:18px}
#login details{margin-top:14px;font-size:12px;color:var(--faint);text-align:left}
#login details input{margin-top:8px;padding:10px;font-size:12px;text-align:left;letter-spacing:0}

/* ── shell ── */
#app{position:relative;z-index:1;display:none;min-height:100vh}
#app.on{display:grid;grid-template-columns:250px 1fr}
aside{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:linear-gradient(180deg,rgba(9,10,16,.75),rgba(6,7,11,.6));backdrop-filter:blur(16px);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 20px}
.brand svg{width:38px;height:38px;filter:drop-shadow(0 4px 18px rgba(110,136,255,.6));animation:float 5s ease-in-out infinite}
.brand b{font-size:19px;letter-spacing:.02em}
.brand small{display:block;font-size:10px;letter-spacing:.3em;color:var(--faint);margin-top:3px}
.clock{margin:0 8px 14px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25)}
.clock b{font-size:26px;letter-spacing:-.03em;font-weight:700}
.clock b span{color:var(--blue);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.clock small{display:block;font-size:11px;color:var(--faint);letter-spacing:.14em;margin-top:2px}
nav.side{position:relative}
nav.side a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--dim);text-decoration:none;font-size:14.5px;font-weight:500;transition:color .2s,background .2s;position:relative;z-index:1}
nav.side a svg{width:18px;height:18px;flex:none;transition:transform .3s var(--spring)}
nav.side a:hover{color:var(--paper);background:rgba(243,241,234,.035)}
nav.side a:hover svg{transform:scale(1.15) rotate(-6deg)}
nav.side a.on{color:var(--paper)}
nav.side a.on svg{color:var(--blue3)}
nav.side .pill-bg{position:absolute;left:0;right:0;height:42px;border-radius:12px;background:linear-gradient(90deg,rgba(110,136,255,.2),rgba(110,136,255,.03));border:1px solid rgba(110,136,255,.18);transition:top .45s var(--spring);z-index:0}
nav.side .pill-bg::before{content:"";position:absolute;left:-16px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--blue);box-shadow:0 0 14px var(--blue)}
nav.side a .badge{margin-left:auto;font-size:11px;min-width:20px;text-align:center;padding:2px 7px;border-radius:999px;background:rgba(255,106,213,.16);color:var(--pink)}
.side-foot{margin-top:auto;padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);font-size:12px;color:var(--dim)}
.side-foot .row{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint);flex:none;position:relative}
.dot.live::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid currentColor;color:inherit;opacity:0;animation:ping 2s ease-out infinite}
.dot.live{color:var(--mint)}
@keyframes ping{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(2.2)}}
.dot.off{background:var(--red);box-shadow:0 0 10px var(--red)}
.side-foot button{margin-top:8px;width:100%;padding:8px;border-radius:10px;border:1px solid var(--line2);background:transparent;color:var(--dim);cursor:pointer;font-size:12px;transition:all .2s}
.side-foot button:hover{color:var(--paper);border-color:var(--blue);background:rgba(110,136,255,.08)}

main{min-width:0;padding:26px 34px 90px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:24px}
.top h2{font-size:30px;letter-spacing:-.035em;font-weight:700}
.top .sub{color:var(--dim);font-size:13.5px;margin-top:3px}
.top .grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line2);background:rgba(243,241,234,.03);cursor:pointer;font-size:13.5px;font-weight:600;transition:transform .15s,border-color .2s,background .2s,box-shadow .2s;white-space:nowrap}
.btn:hover{border-color:var(--blue);background:rgba(110,136,255,.08)}
.btn:active{transform:scale(.96)}
.btn.primary{border:0;background:linear-gradient(135deg,var(--blue),var(--blue2));box-shadow:0 10px 26px -10px rgba(110,136,255,.9)}
.btn.primary:hover{box-shadow:0 14px 34px -8px rgba(110,136,255,1)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.kbd{font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid var(--line2);color:var(--faint)}
#view{animation:pageIn .55s var(--ease)}
#view.swap{animation:none}
@keyframes pageIn{from{opacity:0;transform:translateY(14px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}

/* ── cards ── */
.grid{display:grid;gap:16px}
.g6{grid-template-columns:repeat(6,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:span 4}.span6{grid-column:1/-1}
.mt{margin-top:16px}
.card{--mx:50%;--my:50%;position:relative;border-radius:var(--r);background:var(--card);border:1px solid var(--line);padding:18px 20px;backdrop-filter:blur(14px);overflow:hidden;animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0) * 55ms);transition:border-color .3s,transform .3s var(--ease),box-shadow .3s}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(140deg,rgba(110,136,255,.4),transparent 35%,transparent 70%,rgba(61,220,151,.2));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.55;transition:opacity .3s}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(420px circle at var(--mx) var(--my),rgba(110,136,255,.11),transparent 45%);opacity:0;transition:opacity .3s}
.card:hover{border-color:var(--line2);box-shadow:0 20px 60px -30px rgba(110,136,255,.45)}
.card:hover::after{opacity:1}.card:hover::before{opacity:1}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
.card h3{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.card h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:var(--faint);font-size:12px}
.kpi{min-height:136px}
.kpi h3{padding-right:44px;display:block;line-height:1.35;letter-spacing:.09em;min-height:2.7em}
.kpi .v{margin-top:14px;font-size:34px;font-weight:700;letter-spacing:-.04em;line-height:1;position:relative;z-index:1}
.kpi .v small{font-size:14px;color:var(--dim);font-weight:500;letter-spacing:0;margin-left:4px}
.kpi .d{margin-top:9px;font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:6px;position:relative;z-index:1;max-width:calc(100% - 96px)}
.kpi .d .up{color:var(--mint);font-weight:600}
.kpi .spark{position:absolute;right:12px;bottom:12px;width:96px;height:38px}
.kpi .ic{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(110,136,255,.12);color:var(--blue3);transition:transform .4s var(--spring)}
.kpi:hover .ic{transform:rotate(-10deg) scale(1.1)}
.kpi .ic svg{width:17px;height:17px}
.chart{width:100%;display:block;overflow:visible;position:relative;z-index:1}
.chart text{font-family:'Archivo',sans-serif}
.chart .colg .hl{opacity:0;transition:opacity .15s}
.chart .colg:hover .hl{opacity:1}
.chart .colg:hover .bar{filter:brightness(1.35) drop-shadow(0 0 8px currentColor)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--dim);position:relative;z-index:1}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.empty{padding:26px 10px;text-align:center;color:var(--faint);font-size:13px;position:relative;z-index:1}
.tip{position:fixed;z-index:80;pointer-events:none;padding:9px 12px;border-radius:12px;background:rgba(10,11,18,.92);backdrop-filter:blur(8px);border:1px solid var(--line2);font-size:12px;line-height:1.5;box-shadow:0 14px 40px rgba(0,0,0,.6);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;white-space:nowrap}
.tip.on{opacity:1;transform:none}
.tip b{color:var(--paper)}.tip span{color:var(--dim)}

/* ── lists / tables ── */
.list{margin-top:12px;display:flex;flex-direction:column;gap:2px;position:relative;z-index:1}
.li{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;transition:background .15s,transform .2s}
.li:hover{background:rgba(243,241,234,.04)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t small{display:block;margin-top:2px;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap;text-decoration:none}
.pill.mint{color:var(--mint);border-color:rgba(61,220,151,.35);background:rgba(61,220,151,.08)}
.pill.blue{color:var(--blue3);border-color:rgba(110,136,255,.35);background:rgba(110,136,255,.08)}
.pill.amber{color:var(--amber);border-color:rgba(245,181,68,.35);background:rgba(245,181,68,.08)}
.pill.red{color:var(--red);border-color:rgba(255,90,95,.35);background:rgba(255,90,95,.08)}
.pill.pink{color:var(--pink);border-color:rgba(255,106,213,.35);background:rgba(255,106,213,.08)}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px;position:relative;z-index:1}
th{text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:rgba(243,241,234,.025)}
td.amt{text-align:right;font-weight:700}
.check{width:22px;height:22px;border-radius:7px;border:1.6px solid var(--faint);display:grid;place-items:center;cursor:pointer;flex:none;background:transparent;transition:all .25s var(--spring)}
.check:hover{border-color:var(--mint);transform:scale(1.1)}
.check.on{background:var(--mint);border-color:var(--mint);box-shadow:0 0 16px rgba(61,220,151,.55)}
.check.on::after{content:"";width:9px;height:5px;border-left:2.2px solid #05060A;border-bottom:2.2px solid #05060A;transform:rotate(-45deg) translate(1px,-1px)}
.done .t b{color:var(--faint);text-decoration:line-through}
.bar-in{height:8px;border-radius:999px;background:rgba(243,241,234,.06);overflow:hidden;position:relative}
.bar-in i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue2),var(--blue));box-shadow:0 0 12px rgba(110,136,255,.6);animation:fill 1.2s var(--ease) both;position:relative;overflow:hidden}
.bar-in i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:translateX(-100%);animation:shine 2.6s 1.2s ease-in-out infinite}
@keyframes fill{from{width:0!important}}
@keyframes shine{60%,100%{transform:translateX(100%)}}

/* ── forms ── */
.form{display:grid;gap:10px;margin-top:12px;position:relative;z-index:1}
.form .row{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.form label{font-size:11.5px;color:var(--dim);display:flex;flex-direction:column;gap:5px}
.form input,.form select,.form textarea{padding:10px 12px;border-radius:11px;border:1px solid var(--line2);background:rgba(0,0,0,.3);outline:none;font-size:13.5px;transition:border-color .2s,box-shadow .2s}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(110,136,255,.15)}
.form textarea{min-height:70px;resize:vertical}
.seg{display:inline-flex;padding:3px;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.25);flex-wrap:wrap}
.seg button{padding:7px 12px;border:0;border-radius:9px;background:transparent;color:var(--dim);cursor:pointer;font-size:12.5px;font-weight:600;transition:all .2s}
.seg button:hover{color:var(--paper)}
.seg button.on{background:rgba(110,136,255,.22);color:var(--paper);box-shadow:0 0 0 1px rgba(110,136,255,.3) inset}

/* ── kanban ── */
.kanban{display:grid;grid-template-columns:repeat(6,minmax(165px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px}
.col{border-radius:18px;border:1px solid var(--line);background:rgba(10,12,19,.55);padding:12px;min-height:220px;transition:border-color .2s,background .2s,transform .2s;animation:rise .6s var(--ease) both;animation-delay:calc(var(--i,0) * 60ms)}
.col.over{border-color:var(--blue);background:rgba(110,136,255,.07);transform:scale(1.01)}
.col h4{display:flex;align-items:center;gap:8px;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:4px 4px 10px}
.col h4 i{width:8px;height:8px;border-radius:50%}
.col h4 span{margin-left:auto;color:var(--faint);letter-spacing:0}
.deal{position:relative;padding:12px 13px;border-radius:14px;background:var(--card2);border:1px solid var(--line);margin-bottom:9px;cursor:grab;transition:transform .2s var(--ease),border-color .2s,box-shadow .2s;overflow:hidden}
.deal::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sc,#6E88FF);box-shadow:0 0 12px var(--sc,#6E88FF)}
.deal:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:0 14px 30px -14px rgba(0,0,0,.8)}
.deal.dragging{opacity:.4}
.deal b{font-size:13.5px;display:block}
.deal small{display:block;color:var(--dim);font-size:11.5px;margin-top:3px}
.deal .meta{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.deal .sig{margin-top:8px;font-size:11.5px;color:var(--amber)}

/* ── modal, palette, toast ── */
.veil{position:fixed;inset:0;z-index:60;background:rgba(3,4,8,.62);backdrop-filter:blur(8px);display:none;align-items:flex-start;justify-content:center;padding:10vh 16px}
.veil.on{display:flex;animation:fadeUp .25s}
.modal{width:min(520px,100%);border-radius:24px;background:#0C0E17;border:1px solid var(--line2);padding:22px;box-shadow:0 40px 120px rgba(0,0,0,.8);animation:pop .35s var(--spring)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
.modal h3{font-size:18px;letter-spacing:-.02em}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#palette input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line2);background:rgba(0,0,0,.35);outline:none;font-size:15px}
#palette .opts{margin-top:10px;max-height:50vh;overflow:auto}
#palette .opt{padding:11px 12px;border-radius:11px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:14px;color:var(--dim)}
#palette .opt.on,#palette .opt:hover{background:rgba(110,136,255,.14);color:var(--paper)}
#toast{position:fixed;left:50%;bottom:28px;z-index:90;transform:translate(-50%,20px) scale(.96);opacity:0;transition:all .35s var(--spring);padding:12px 18px;border-radius:14px;background:#11131D;border:1px solid rgba(110,136,255,.35);font-size:13.5px;box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 30px -10px rgba(110,136,255,.6)}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}

/* ── hero ── */
.hero{display:flex;align-items:flex-end;gap:18px;margin-bottom:22px;flex-wrap:wrap}
.hero h1{font-size:42px;letter-spacing:-.045em;line-height:1.05}
.hero h1 em{font-style:normal;background:linear-gradient(100deg,var(--blue3),var(--blue) 35%,var(--mint) 65%,var(--blue3));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 6s linear infinite}
@keyframes sheen{to{background-position:-200% 0}}
.hero p{color:var(--dim);font-size:14px;margin-top:8px}
.ticker{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.ring-wrap{display:flex;align-items:center;gap:18px;margin-top:12px;position:relative;z-index:1}
.cd{display:flex;gap:8px;margin-top:4px}
.cd div{text-align:center;min-width:50px;padding:8px 6px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid var(--line)}
.cd b{display:block;font-size:20px;font-weight:700;letter-spacing:-.03em}
.cd span{display:block;font-size:9.5px;letter-spacing:.14em;color:var(--faint);margin-top:2px}

@media (max-width:1350px){.g6{grid-template-columns:repeat(3,1fr)}}
@media (max-width:1000px){
  #app.on{grid-template-columns:1fr}
  aside{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;z-index:40;flex-direction:row;padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);overflow-x:auto}
  .brand,.side-foot,.clock{display:none}
  nav.side{display:flex;gap:2px}
  nav.side .pill-bg{display:none}
  nav.side a{flex-direction:column;gap:4px;font-size:10.5px;padding:8px 10px}
  nav.side a.on{background:rgba(110,136,255,.16)}
  nav.side a .badge{display:none}
  main{padding:18px 16px 110px}
  .g4,.g3,.g2{grid-template-columns:1fr}.g6{grid-template-columns:repeat(2,1fr)}
  .span2,.span3,.span4{grid-column:auto}
  .top h2{font-size:24px}.hero h1{font-size:30px}
  .top .hide-m{display:none}
  .kpi .v{font-size:28px}.kpi .spark{display:none}.kpi .d{max-width:100%}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>

}
const docs = col => Object.entries(S.cols[col] || {}).map(([id, d]) => ({ id, ...d.data, _v: d.v, _at: d.at }));

const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ═════════ helpers ═════════ */
const $ = s => document.querySelector(s);

const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const dayLabel = iso => new Date(iso + 'T12:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const wd = iso => new Date(iso + 'T12:00:00Z').toLocaleDateString('en-GB', { weekday: 'short' });
const ago = t => { if (!t) return ''; const s = (Date.now() - new Date(t)) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago'; if (s < 86400) return Math.floor(s / 3600) + ' h ago'; return Math.floor(s / 86400) + ' d ago'; };

}

const ICON = {

  money: '<circle cx="12" cy="12" r="9"/><path d="M15 9.5a3 3 0 0 0-5.6-.5c-.6 1.6.6 2.6 2.6 3s3.2 1.4 2.6 3A3 3 0 0 1 9 14.5M12 6v1.5M12 16.5V18"/>',

  clients: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/>',
  tasks: '<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
  spark: '<path d="M12 3l2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"/>',
  mail: '<path d="M4 4h16v16H4z"/><path d="M4 7l8 6 8-6"/>', eye: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  fire: '<path d="M12 3c1 3 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 3-6 0 2 1 3 2 3 0-3-.5-5 0-7z"/>',
  trend: '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',

const ico = (n, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[n] || ''}</svg>`;

/* ═════════ charts (hand-made SVG) ═════════ */
const tip = $('#tip');
function bindTips(root) {
  root.querySelectorAll('[data-tip]').forEach(el => {
    el.addEventListener('pointermove', e => { tip.innerHTML = el.dataset.tip; tip.classList.add('on'); const x = Math.min(e.clientX + 16, innerWidth - tip.offsetWidth - 8); tip.style.left = x + 'px'; tip.style.top = Math.max(8, e.clientY - tip.offsetHeight - 14) + 'px'; });

// "nice" axis: max rounded up to 1/2/2.5/5 x 10^n, 4 steps
function nice(max) {
  max = Math.max(1, max);
  const raw = max / 4, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  return { step, top: step * 4 };
}
// monotone cubic curve through points (no overshoot below zero)
function curve(pts) {
  const n = pts.length; if (!n) return ''; if (n === 1) return `M${pts[0][0]},${pts[0][1]}`;

  for (let i = 0; i < n - 1; i++) { dx[i] = pts[i + 1][0] - pts[i][0]; m[i] = (pts[i + 1][1] - pts[i][1]) / (dx[i] || 1); }

  for (let i = 1; i < n - 1; i++) t[i] = m[i - 1] * m[i] <= 0 ? 0 : (m[i - 1] + m[i]) / 2;

let gid = 0;
function grid(W, pl, pr, pt, ih, ticks, fmtTick) {

  ticks.forEach(v => { const y = pt + ih - ih * (v - ticks[0]) / (ticks[ticks.length - 1] - ticks[0] || 1); s += `<line x1="${pl}" x2="${W - pr}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(243,241,234,${v === 0 ? .14 : .05})" ${v === 0 ? '' : 'stroke-dasharray="3 5"'}/><text x="${pl - 8}" y="${(y + 3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="#5F6478">${fmtTick(v)}</text>`; });

const short = v => Math.abs(v) >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0) + 'k' : String(+v.toFixed(1));
// bars (stacked or side by side) + optional line on top
function barChart({ labels, bars, line, h = 220, fmt = nf, stacked = true }) {

  const bw = Math.max(3, iw / n * .6), id = 'g' + (++gid);

const CALL_ST = [['', 'To call', ''], ['JĀ', 'YES', 'mint'], ['INFO', 'Info', 'blue'], ['ATZVANĪT', 'Call back', 'amber'], ['NEATBILD', 'No answer', ''], ['NĒ', 'No', 'red'], ['NEDARBOJAS', 'Dead', 'red']];
VIEWS.calls = () => {
  const f = ls.get('hq-callf') || 'todo', q = (ls.get('hq-callq') || '').toLowerCase();
  const first = ((doc('meta', 'main') || {}).callFirst || []).map(Number);
  let calls = docs('calls').map(c => ({ ...c, st: (c.status || '').toUpperCase() === 'NEW' ? '' : (c.status || '').toUpperCase() }));
  const counts = Object.fromEntries(CALL_ST.map(([k]) => [k, calls.filter(c => c.st === k).length]));
  const doneN = calls.filter(c => c.st && c.st !== 'NEATBILD').length, total = calls.length;
  if (f === 'todo') calls = calls.filter(c => !c.st || c.st === 'NEATBILD' || c.st === 'ATZVANĪT'); else if (f !== 'all') calls = calls.filter(c => c.st === f);
  if (q) calls = calls.filter(c => (c.business + ' ' + c.trade + ' ' + c.phone).toLowerCase().includes(q));
  calls.sort((a, b) => { const fa = first.indexOf(+a.nr), fb = first.indexOf(+b.nr); return (fa < 0 ? 999 : fa) - (fb < 0 ? 999 : fb) || (+a.nr - +b.nr); });
  return `<div class="grid g4">${kpi('Businesses', total, { ic: 'calls' })}${kpi('Reached', doneN, { d: `${total ? Math.round(100 * doneN / total) : 0}% of the list`, ic: 'trend', color: '#A9B8FF' })}${kpi('Said YES', counts['JĀ'] || 0, { ic: 'spark', color: '#3DDC97' })}${kpi('Call back', counts['ATZVANĪT'] || 0, { ic: 'calls', color: '#F5B544' })}</div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0 14px"><div class="seg" id="callSeg">${[['todo', 'To do'], ['all', 'All'], ...CALL_ST.slice(1).map(s => [s[0], s[1]])].map(([k, l]) => `<button class="${f === k ? 'on' : ''}" data-f="${esc(k)}">${l}${k !== 'todo' && k !== 'all' ? ` ${counts[k] || 0}` : ''}</button>`).join('')}</div><input id="callQ" placeholder="Search…" value="${esc(q)}" style="padding:9px 12px;border-radius:11px;border:1px solid var(--line2);background:rgba(0,0,0,.3);outline:none;min-width:200px"></div>
  <div class="card"><h3>${calls.length} businesses <span class="r">★ = call first</span></h3><div class="list">${calls.slice(0, 150).map(c => `<div class="li" style="align-items:flex-start;flex-wrap:wrap"><div class="t" style="min-width:220px"><b>${first.includes(+c.nr) ? '<span style="color:var(--amber)">★ </span>' : ''}${esc(c.nr)}. ${esc(c.business)}</b><small>${esc(c.trade)} · <a href="tel:${esc(String(c.phone).replace(/\s/g, ''))}" style="color:var(--blue3)">${esc(c.phone)}</a>${c.calledOn ? ' · called ' + esc(c.calledOn) : ''}</small>${c.why ? `<small style="white-space:normal;color:var(--faint);margin-top:4px">${esc(c.why)}</small>` : ''}${c.note ? `<small style="white-space:normal;color:var(--amber);margin-top:4px">${esc(c.note)}</small>` : ''}</div><div style="display:flex;gap:5px;flex-wrap:wrap">${CALL_ST.slice(1).map(([k, l, col]) => `<button class="btn sm" style="${c.st === k ? `border-color:var(--${col || 'blue'});background:rgba(110,136,255,.14);color:var(--paper)` : ''}" data-call="${c.id}" data-st="${esc(k)}">${l}</button>`).join('')}<button class="btn sm" data-note="${c.id}">note</button></div></div>`).join('') || '<div class="empty">Nothing here.</div>'}</div></div>`;
};
AFTER.calls = v => {
  v.querySelectorAll('#callSeg button').forEach(b => b.onclick = () => { ls.set('hq-callf', b.dataset.f); render(true); });
  const q = v.querySelector('#callQ'); q.oninput = () => { ls.set('hq-callq', q.value); clearTimeout(q.t); q.t = setTimeout(() => { render(true); const n = $('#callQ'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
  v.querySelectorAll('[data-call]').forEach(b => b.onclick = async () => { await patch('calls', b.dataset.call, { status: b.dataset.st, calledOn: today(), updatedAt: new Date().toISOString(), by: 'HQ' }); toast('Saved: ' + b.textContent); });
  v.querySelectorAll('[data-note]').forEach(b => b.onclick = async () => { const c = doc('calls', b.dataset.note); const n = prompt('Note for ' + c.business, c.note || ''); if (n != null) await patch('calls', c.id, { note: n }); });
};

VIEWS.clients = () => {
  const M = money(), act = M.clients.filter(c => c.status === 'active');
  return `<div class="grid g4">${kpi('Active clients', act.length, { ic: 'clients', color: '#3DDC97' })}${kpi('On free week', M.clients.filter(c => c.status === 'trial').length, { ic: 'spark' })}${kpi('MRR', M.mrr, { pre: '€', ic: 'money', color: '#3DDC97' })}${kpi('Avg / client', act.length ? M.mrr / act.length : 0, { pre: '€', ic: 'trend' })}</div>
  <div class="grid g3 mt">${M.clients.map(c => `<div class="card"><h3>${esc(c.trade || 'client')} <span class="r"><span class="pill ${c.status === 'active' ? 'mint' : c.status === 'trial' ? 'blue' : 'red'}">${esc(c.status)}</span></span></h3><div style="font-size:22px;font-weight:700;margin-top:10px;letter-spacing:-.02em;position:relative;z-index:1">${esc(c.name)}</div><div style="color:var(--dim);font-size:13px;margin-top:4px;position:relative;z-index:1">since ${esc(c.since ? dayLabel(c.since) : '–')}${c.founding ? ' · founding client' : ''}</div><div style="font-size:28px;font-weight:700;margin-top:12px;position:relative;z-index:1" class="num">${eur(c.monthly)}<small style="font-size:13px;color:var(--dim)">/mo</small></div><div class="legend">${(c.tools || []).map(t => `<span class="pill blue">${esc(t)}</span>`).join('')}</div></div>`).join('') || `<div class="card span3"><div class="empty" style="padding:56px 10px"><div style="font-size:44px;animation:float 3s ease-in-out infinite">🚀</div><div style="margin-top:12px;font-size:17px;color:var(--paper)">The first client is coming.</div><div style="margin-top:6px">When someone signs, press <b>+ Add → Client</b>, or tell Claude.</div></div></div>`}</div>${widgetsFor('clients')}`;
};
function clientModal() {
  openModal(`<h3>New client</h3><form class="form" id="clientForm"><div class="row"><label>Name<input name="name" required></label><label>Trade<input name="trade"></label></div>
  <div class="row"><label>Monthly €<input name="monthly" type="number" value="99"></label><label>Setup €<input name="setup" type="number" value="0"></label></div>
  <div class="row"><label>Status<select name="status"><option value="trial">Free week</option><option value="active">Active</option><option value="paused">Paused</option><option value="lost">Lost</option></select></label><label>Since<input name="since" type="date" value="${today()}"></label></div>
  <label>Tools (comma separated)<input name="tools" placeholder="AI phone, text-back"></label><label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" name="founding" checked> Founding client</label>
  <div class="actions"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Save</button></div></form>`);
  const f = $('#clientForm');
  f.onsubmit = async e => { e.preventDefault(); const x = Object.fromEntries(new FormData(f)); x.monthly = +x.monthly || 0; x.setup = +x.setup || 0; x.founding = !!x.founding; x.tools = (x.tools || '').split(',').map(s => s.trim()).filter(Boolean); await put('clients', uid('c'), x); closeModal(); toast('Client added 🎉'); };
}

VIEWS.tasks = () => {
  const all = docs('tasks').sort((a, b) => String(a.due || '9').localeCompare(String(b.due || '9')));
  const t = today(), groups = [['Overdue', all.filter(x => !x.done && x.due && x.due < t)], ['Today', all.filter(x => !x.done && x.due === t)], ['Coming up', all.filter(x => !x.done && (!x.due || x.due > t))], ['Done', all.filter(x => x.done).slice(-15).reverse()]];
  const doneN = all.filter(x => x.done).length;
  return `<div class="grid g3"><div class="span2">${groups.map(([g, list]) => list.length ? `<div class="card" style="margin-bottom:16px"><h3>${g === 'Overdue' ? '<span style="color:var(--red)">●</span> ' : ''}${g} <span class="r">${list.length}</span></h3><div class="list">${list.map(x => `<div class="li ${x.done ? 'done' : ''}"><button class="check ${x.done ? 'on' : ''}" data-t="${x.id}" aria-label="done"></button><div class="t"><b>${esc(x.title)}</b><small>${x.due ? esc(wd(x.due) + ' ' + dayLabel(x.due)) : 'no date'}${x.time ? ' · ' + esc(x.time) : ''}${x.area ? ' · ' + esc(x.area) : ''}</small></div><button class="btn sm" data-tdel="${x.id}" aria-label="delete">✕</button></div>`).join('')}</div></div>` : '').join('') || '<div class="card"><div class="empty">No tasks.</div></div>'}</div>
  <div style="display:flex;flex-direction:column;gap:16px;align-self:start"><div class="card"><h3>Progress</h3><div class="ring-wrap">${ring(all.length ? doneN / all.length : 0, { label: `${doneN}/${all.length}`, color: '#3DDC97' })}<div style="font-size:13px;color:var(--dim)">tasks done</div></div></div>
  <div class="card"><h3>Add task</h3><form class="form" id="taskForm"><label>Task<input name="title" required></label><div class="row"><label>Date<input name="due" type="date" value="${t}"></label><label>Time<input name="time" placeholder="16:00"></label></div><label>Area<select name="area"><option>calls</option><option>email</option><option>content</option><option>partners</option><option>admin</option></select></label><button class="btn primary" style="justify-content:center">Add</button></form></div></div></div>${widgetsFor('tasks')}`;
};
AFTER.tasks = v => {
  v.querySelectorAll('[data-t]').forEach(b => b.onclick = async () => { const x = doc('tasks', b.dataset.t); b.classList.toggle('on'); await patch('tasks', x.id, { done: !x.done, doneAt: x.done ? null : today() }); if (!x.done) toast('Done ✓'); });
  v.querySelectorAll('[data-tdel]').forEach(b => b.onclick = async () => { await del('tasks', b.dataset.tdel); toast('Deleted'); });
  const f = v.querySelector('#taskForm'); f.onsubmit = async e => { e.preventDefault(); await put('tasks', uid('t'), { ...Object.fromEntries(new FormData(f)), done: false }); toast('Task added ✓'); };
};

/* ═════════ modal, add menu, palette ═════════ */
function openModal(html) { $('#modal').innerHTML = html; $('#modalVeil').classList.add('on'); $('#modal').querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal); const i = $('#modal input'); if (i) setTimeout(() => i.focus(), 50); }
function closeModal() { $('#modalVeil').classList.remove('on'); }
$('#modalVeil').onclick = e => { if (e.target.id === 'modalVeil') closeModal(); };
function addMenu() {
  openModal(`<h3>Add</h3><div class="list" style="margin-top:10px">${[['task', 'Task', 'tasks', 'something to do'], ['money', 'Money entry', 'money', 'a cost or income'], ['deal', 'Deal / lead', 'pipeline', 'someone interested'], ['client', 'Client', 'clients', 'someone who signed']].map(([k, l, ic, s]) => `<div class="li" style="cursor:pointer" data-add="${k}"><span class="pill blue" style="padding:8px">${ico(ic, 16)}</span><div class="t"><b>${l}</b><small>${s}</small></div></div>`).join('')}</div>`);
  $('#modal').querySelectorAll('[data-add]').forEach(el => el.onclick = () => doAdd(el.dataset.add));
}
function doAdd(k) {
  if (k === 'deal') return dealModal(null);
  if (k === 'client') return clientModal();
  if (k === 'money') { closeModal(); go('money'); return setTimeout(() => { const i = $('#moneyForm input[name=label]'); i.scrollIntoView({ block: 'center', behavior: 'smooth' }); i.focus({ preventScroll: true }); }, 200); }
  closeModal(); go('tasks'); setTimeout(() => $('#taskForm input[name=title]').focus(), 200);
}
$('#addBtn').onclick = addMenu;
const PAL = () => [...PAGES.map(([id, l]) => ({ l: 'Go to ' + l, run: () => go(id) })), { l: 'Add task', run: () => doAdd('task') }, { l: 'Add money entry', run: () => doAdd('money') }, { l: 'Add deal', run: () => doAdd('deal') }, { l: 'Add client', run: () => doAdd('client') }, { l: 'Refresh data', run: () => load() },
  ...docs('deals').map(d => ({ l: 'Deal: ' + d.name, run: () => { go('pipeline'); dealModal(d); } })), ...docs('calls').map(c => ({ l: 'Call: ' + c.business, run: () => { ls.set('hq-callf', 'all'); ls.set('hq-callq', c.business); go('calls'); } }))];
let palSel = 0, palList = [];
function openPal() { $('#palVeil').classList.add('on'); const i = $('#palIn'); i.value = ''; palSel = 0; drawPal(); setTimeout(() => i.focus(), 30); }
function drawPal() { const q = $('#palIn').value.toLowerCase(); palList = PAL().filter(o => o.l.toLowerCase().includes(q)).slice(0, 12); palSel = Math.max(0, Math.min(palSel, palList.length - 1)); $('#palOpts').innerHTML = palList.map((o, i) => `<div class="opt ${i === palSel ? 'on' : ''}" data-i="${i}">${esc(o.l)}</div>`).join(''); $('#palOpts').querySelectorAll('.opt').forEach(el => el.onclick = () => { $('#palVeil').classList.remove('on'); palList[+el.dataset.i].run(); }); }
$('#palIn').oninput = () => { palSel = 0; drawPal(); };
$('#palIn').onkeydown = e => { if (e.key === 'ArrowDown') { palSel = Math.min(palSel + 1, palList.length - 1); drawPal(); e.preventDefault(); } else if (e.key === 'ArrowUp') { palSel = Math.max(0, palSel - 1); drawPal(); e.preventDefault(); } else if (e.key === 'Enter' && palList[palSel]) { $('#palVeil').classList.remove('on'); palList[palSel].run(); } };
$('#palVeil').onclick = e => { if (e.target.id === 'palVeil') $('#palVeil').classList.remove('on'); };
$('#palBtn').onclick = openPal;
addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPal(); } if (e.key === 'Escape') { closeModal(); $('#palVeil').classList.remove('on'); } });

/* ═════════ intro / login / start ═════════ */
function intro() {
  if (REDUCE || ss.get('hq-intro')) return { done: () => {}, };
  ss.set('hq-intro', '1');
  const el = $('#intro'), bar = $('#introBar'), t0 = Date.now();
  el.classList.add('on'); setTimeout(() => bar.style.width = '55%', 200);
  let closed = false;
  const close = () => { if (closed) return; closed = true; bar.style.width = '100%'; setTimeout(() => { el.classList.add('out'); setTimeout(() => el.classList.remove('on', 'out'), 700); }, 250); };
  el.onclick = close;
  return { done: () => setTimeout(close, Math.max(0, 1500 - (Date.now() - t0))) };
}
function showLogin(err) { $('#app').classList.remove('on'); $('#login').style.display = 'grid'; $('#loginErr').textContent = err || ''; $('#apiIn').value = API; setTimeout(() => $('#keyIn').focus(), 50); }
$('#loginForm').onsubmit = async e => {
  e.preventDefault(); KEY = $('#keyIn').value.trim(); API = ($('#apiIn').value.trim() || DEFAULT_API).replace(/\/$/, '');
  $('#loginErr').textContent = 'Checking…';
  try { await api('/hq/all'); ls.set('hq-key', KEY); ls.set('hq-api', API === DEFAULT_API ? null : API); start(); }
  catch (err) { $('#loginErr').textContent = err.status === 403 ? 'Wrong key.' : 'Server not reachable.'; }
};
$('#logoutBtn').onclick = () => { ls.set('hq-key', null); KEY = ''; showLogin(); };
$('#refreshBtn').onclick = async () => { if (await load('soft')) toast('Up to date ✓'); };
async function start() {
  const it = intro();
  $('#login').style.display = 'none'; $('#app').classList.add('on');
  if (location.hash) page = location.hash.slice(1);
  await load(); it.done();
}
setInterval(() => { if (KEY && !document.hidden) load('soft'); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && KEY && Date.now() - lastSync > 20000) load('soft'); });
tickClock();
if (KEY) start(); else showLogin();
})();
</script>
</body>
