<style>
:root{
  --ink:#06070B;--surf:#0C0E15;--card:rgba(13,15,23,.78);--card2:#121520;--raise:#161A27;
  --line:rgba(236,238,245,.065);--line2:rgba(236,238,245,.12);--line3:rgba(236,238,245,.2);
  --paper:#ECEEF5;--dim:#A2A7BA;--faint:#666B80;--mute:#3B3F50;
  --blue:#6E88FF;--blue2:#4259D9;--blue3:#A9B8FF;
  /* chart palette (validated on the dark surface: dataviz check, all pass) */
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767;
  /* status (fixed meaning, always with a label) */
  --good:#2FBF71;--warn:#fab219;--serious:#ec835a;--crit:#e5484d;
  --mint:#2FBF71;--pink:#d55181;--amber:#e3a416;--red:#e5484d;--violet:#9085e9;
  --ease:cubic-bezier(.2,.7,.15,1);--spring:cubic-bezier(.34,1.4,.64,1);--r:18px;
  --mono:ui-monospace,'JetBrains Mono','SFMono-Regular',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ink);color-scheme:dark}
body{font-family:'Archivo',system-ui,sans-serif;color:var(--paper);background:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
::selection{background:var(--blue);color:var(--ink)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(236,238,245,.09);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

/* ── background: slow light, fine grid, vignette ── */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(110px);will-change:transform}
.bg i:nth-child(1){width:52vw;height:40vw;left:46%;top:-26%;background:radial-gradient(circle,rgba(66,89,217,.55),transparent 64%);opacity:.55;animation:drift1 30s ease-in-out infinite alternate}
.bg i:nth-child(2){width:42vw;height:42vw;left:-18%;top:52%;background:radial-gradient(circle,rgba(43,58,158,.6),transparent 64%);opacity:.4;animation:drift2 36s ease-in-out infinite alternate}
.bg i:nth-child(3){width:28vw;height:28vw;left:38%;top:42%;background:radial-gradient(circle,rgba(25,158,112,.5),transparent 64%);opacity:.12;animation:drift3 42s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(-12vw,8vh) scale(1.12)}}
@keyframes drift2{to{transform:translate(16vw,-12vh) scale(1.15)}}
@keyframes drift3{to{transform:translate(-8vw,-16vh) scale(.9)}}
.bg::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(236,238,245,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(236,238,245,.035) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(80% 60% at 60% 20%,#000,transparent 75%);mask-image:radial-gradient(80% 60% at 60% 20%,#000,transparent 75%)}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,transparent 40%,rgba(0,0,0,.55))}

/* ── intro: the logo folds together, the screen folds open ── */
#intro{position:fixed;inset:0;z-index:100;display:none;cursor:pointer;overflow:hidden;background:transparent}
#intro.on{display:block}
#intro .half{position:absolute;left:0;right:0;height:50%;background:#030407;z-index:1;transition:transform .9s cubic-bezier(.76,0,.24,1)}
#intro .half.t{top:0;border-bottom:1px solid rgba(110,136,255,0)}
#intro .half.b{bottom:0}
#intro .half::after{content:"";position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--blue) 30%,#fff 50%,var(--blue) 70%,transparent);opacity:0;box-shadow:0 0 18px 2px rgba(110,136,255,.8)}
#intro .half.t::after{bottom:0}#intro .half.b::after{top:0}
#intro.open .half.t{transform:translateY(-101%)}#intro.open .half.b{transform:translateY(101%)}
#intro.open .half::after{opacity:1;transition:opacity .2s}
#intro .stage{position:absolute;inset:0;z-index:2;display:grid;place-items:center;transition:opacity .35s,transform .9s cubic-bezier(.76,0,.24,1),filter .5s}
#intro.open .stage{opacity:0;transform:scale(1.18);filter:blur(8px)}
#intro .gridfx{position:absolute;inset:-20%;background-image:linear-gradient(rgba(110,136,255,.17) 1px,transparent 1px),linear-gradient(90deg,rgba(110,136,255,.17) 1px,transparent 1px);background-size:64px 64px;transform:perspective(700px) rotateX(62deg) translateY(-8%);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(transparent,#000 45%,transparent);mask-image:linear-gradient(transparent 10%,#000 55%,transparent 95%);opacity:0;animation:gridIn 1.4s .05s var(--ease) forwards,gridRun 2.4s linear infinite}
@keyframes gridIn{to{opacity:1}}
@keyframes gridRun{to{background-position:0 64px,0 0}}
#intro .scan{position:absolute;left:0;right:0;height:120px;top:-120px;background:linear-gradient(transparent,rgba(110,136,255,.10),transparent);animation:scan 2.2s .2s linear infinite}
@keyframes scan{to{top:100%}}
#intro .core{position:relative;display:flex;flex-direction:column;align-items:center}
#intro .logo{width:132px;height:132px;perspective:600px;position:relative}
#intro .logo svg{width:100%;height:100%;overflow:visible}
#intro .seg{transform-box:fill-box;transform-origin:center;opacity:0;animation:fold 1s var(--spring) forwards}
#intro .seg:nth-child(1){--rx:90deg;--ry:0deg;--tx:0px;--ty:-90px;animation-delay:.25s}
#intro .seg:nth-child(2){--rx:0deg;--ry:-90deg;--tx:90px;--ty:-30px;animation-delay:.38s}
#intro .seg:nth-child(3){--rx:-90deg;--ry:0deg;--tx:0px;--ty:20px;animation-delay:.51s}
#intro .seg:nth-child(4){--rx:0deg;--ry:90deg;--tx:-90px;--ty:30px;animation-delay:.64s}
#intro .seg:nth-child(5){--rx:90deg;--ry:0deg;--tx:0px;--ty:90px;animation-delay:.77s}
@keyframes fold{from{opacity:0;transform:translate(var(--tx),var(--ty)) rotateX(var(--rx)) rotateY(var(--ry)) scale(.6)}60%{opacity:1}to{opacity:1;transform:none}}
#intro .halo{position:absolute;left:50%;top:66px;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;background:radial-gradient(circle,rgba(110,136,255,.45),transparent 62%);filter:blur(16px);opacity:0;animation:halo 1.6s 1s ease-out forwards}
@keyframes halo{35%{opacity:1;transform:scale(1.15)}to{opacity:.35;transform:scale(1)}}
#intro .orbit{position:absolute;left:50%;top:66px;width:230px;height:230px;margin:-115px 0 0 -115px;border-radius:50%;border:1px solid rgba(110,136,255,.18);opacity:0;animation:orbIn .8s 1s forwards,spin2 6s linear infinite}
#intro .orbit::before{content:"";position:absolute;top:-3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#fff;box-shadow:0 0 14px 3px var(--blue)}
#intro .orbit.o2{width:300px;height:300px;margin:-150px 0 0 -150px;border-style:dashed;border-color:rgba(236,238,245,.07);animation-duration:.8s,14s;animation-direction:normal,reverse}
@keyframes orbIn{to{opacity:1}}
@keyframes spin2{to{transform:rotate(360deg)}}
#intro h1{margin-top:34px;font-size:40px;letter-spacing:.34em;font-weight:800;padding-left:.34em;font-family:var(--mono);min-height:48px;opacity:0;animation:fadeUp .4s 1s forwards}
#intro h1 b{color:var(--blue)}
#intro .sub{margin-top:8px;font-size:11px;letter-spacing:.55em;color:var(--faint);padding-left:.55em;opacity:0;animation:fadeUp .5s 1.25s forwards}
#intro .boot{margin-top:28px;width:min(360px,80vw);font-family:var(--mono);font-size:11px;color:var(--faint);opacity:0;animation:fadeUp .4s 1.2s forwards}
#intro .boot .row{display:flex;justify-content:space-between;margin-bottom:8px}
#intro .boot .row b{color:var(--paper);font-weight:600}
#intro .boot .bar{height:2px;background:rgba(236,238,245,.08);border-radius:2px;overflow:hidden}
#intro .boot .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue2),var(--blue),#fff);box-shadow:0 0 12px var(--blue);transition:width .35s var(--ease)}
#intro .boot .log{margin-top:10px;height:16px;overflow:hidden;color:var(--dim)}
#intro .skip{position:absolute;right:22px;bottom:18px;z-index:3;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--mute)}
#intro.open .skip{opacity:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── login ── */
#login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px}
#login .box{position:relative;width:min(420px,100%);padding:40px 34px 30px;border-radius:24px;background:rgba(12,14,21,.85);border:1px solid var(--line2);backdrop-filter:blur(22px);box-shadow:0 50px 140px -30px rgba(0,0,0,.9);text-align:center;animation:fadeUp .7s var(--ease)}
#login .box::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;background:conic-gradient(from var(--a,0deg),transparent 0 72%,var(--blue) 88%,#fff 94%,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 6s linear infinite}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
#login svg.mark{width:60px;height:60px;filter:drop-shadow(0 8px 30px rgba(110,136,255,.5))}
#login h1{margin-top:18px;font-size:28px;letter-spacing:-.03em}
#login h1 span{color:var(--blue)}
#login p{margin-top:8px;color:var(--dim);font-size:14px}
#login input{margin-top:24px;width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--line2);background:rgba(0,0,0,.35);font-size:15px;outline:none;text-align:center;letter-spacing:.06em;transition:border-color .2s,box-shadow .2s}
#login input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(110,136,255,.16)}
#login .go{margin-top:12px;width:100%;padding:13px;border:0;border-radius:12px;background:var(--paper);color:var(--ink);font-weight:700;font-size:15px;cursor:pointer;transition:transform .15s,background .2s}
#login .go:hover{background:#fff}
#login .go:active{transform:scale(.98)}
#login .err{margin-top:12px;color:var(--crit);font-size:13px;min-height:18px}
#login details{margin-top:14px;font-size:12px;color:var(--faint);text-align:left}
#login details input{margin-top:8px;padding:10px;font-size:12px;text-align:left;letter-spacing:0}

/* ── shell ── */
#app{position:relative;z-index:1;display:none;min-height:100vh}
#app.on{display:grid;grid-template-columns:236px 1fr}
#app.reveal main>*{animation:enter .9s var(--ease) both}
#app.reveal aside{animation:slideIn .8s var(--ease) both}
@keyframes slideIn{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes enter{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
aside{position:sticky;top:0;height:100vh;padding:20px 14px;border-right:1px solid var(--line);background:rgba(7,8,12,.72);backdrop-filter:blur(18px);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px}
.brand svg{width:32px;height:32px;filter:drop-shadow(0 4px 14px rgba(110,136,255,.45))}
.brand b{font-size:16px;letter-spacing:.02em}
.brand small{display:block;font-size:9.5px;letter-spacing:.28em;color:var(--faint);margin-top:3px;font-family:var(--mono)}
.clock{margin:0 4px 14px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.015)}
.clock b{font-size:24px;letter-spacing:-.02em;font-weight:700;font-family:var(--mono)}
.clock b span{color:var(--blue);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.clock small{display:block;font-size:10px;color:var(--faint);letter-spacing:.14em;margin-top:3px;font-family:var(--mono)}
nav.side{position:relative}
nav.side a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--dim);text-decoration:none;font-size:14px;font-weight:500;transition:color .2s,background .2s;position:relative;z-index:1}
nav.side a svg{width:17px;height:17px;flex:none;transition:transform .3s var(--spring)}
nav.side a:hover{color:var(--paper);background:rgba(236,238,245,.035)}
nav.side a:hover svg{transform:scale(1.1)}
nav.side a.on{color:var(--paper)}
nav.side a.on svg{color:var(--blue3)}
nav.side .pill-bg{position:absolute;left:0;right:0;height:38px;border-radius:10px;background:rgba(236,238,245,.06);border:1px solid var(--line2);transition:top .45s var(--spring);z-index:0}
nav.side .pill-bg::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--blue);box-shadow:0 0 12px var(--blue)}
nav.side a .badge{margin-left:auto;font-size:10.5px;min-width:20px;text-align:center;padding:2px 7px;border-radius:999px;background:rgba(213,81,129,.16);color:#F08AB0;font-family:var(--mono)}
.side-foot{margin-top:auto;padding:12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.015);font-size:12px;color:var(--dim)}
.side-foot .row{display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 8px var(--good);flex:none;position:relative}
.dot.live::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid currentColor;opacity:0;animation:ping 2s ease-out infinite}
.dot.live{color:var(--good)}
@keyframes ping{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(2.2)}}
.dot.off{background:var(--crit);box-shadow:0 0 8px var(--crit)}
.side-foot button{margin-top:8px;width:100%;padding:7px;border-radius:9px;border:1px solid var(--line2);background:transparent;color:var(--dim);cursor:pointer;font-size:12px;transition:all .2s}
.side-foot button:hover{color:var(--paper);border-color:var(--line3);background:rgba(236,238,245,.04)}

main{min-width:0;padding:24px 32px 90px;max-width:1500px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.top h2{font-size:26px;letter-spacing:-.03em;font-weight:700}
.top .sub{color:var(--faint);font-size:12.5px;margin-top:4px;font-family:var(--mono);letter-spacing:.02em}
.top .grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:10px;border:1px solid var(--line2);background:rgba(236,238,245,.03);cursor:pointer;font-size:13px;font-weight:600;transition:transform .15s,border-color .2s,background .2s;white-space:nowrap}
.btn:hover{border-color:var(--line3);background:rgba(236,238,245,.06)}
.btn:active{transform:scale(.97)}
.btn.primary{border:0;background:var(--paper);color:var(--ink)}
.btn.primary:hover{background:#fff}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.kbd{font-size:10.5px;padding:2px 6px;border-radius:5px;border:1px solid var(--line2);color:var(--faint);font-family:var(--mono)}
#view{animation:pageIn .5s var(--ease)}
#view.swap{animation:none}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ── cards ── */
.grid{display:grid;gap:14px}
.g6{grid-template-columns:repeat(6,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:span 4}.span6{grid-column:1/-1}
.mt{margin-top:14px}
.card{--mx:50%;--my:50%;position:relative;border-radius:var(--r);background:linear-gradient(180deg,rgba(22,26,39,.72),rgba(12,14,21,.78));border:1px solid var(--line);padding:18px 20px;backdrop-filter:blur(14px);overflow:hidden;animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms);transition:border-color .3s,box-shadow .3s;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(169,184,255,.35),transparent);opacity:.5;pointer-events:none}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(380px circle at var(--mx) var(--my),rgba(110,136,255,.07),transparent 45%);opacity:0;transition:opacity .3s}
.card:hover{border-color:var(--line2)}
.card:hover::after{opacity:1}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card h3{font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px;position:relative;z-index:1;font-family:var(--mono)}
.card h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:var(--faint);font-size:11.5px}
.kpi{min-height:132px}
.kpi h3{padding-right:40px;display:block;line-height:1.4;min-height:2.8em}
.kpi .v{white-space:nowrap;margin-top:12px;font-size:clamp(24px,2.3vw,32px);font-weight:700;letter-spacing:-.035em;line-height:1;position:relative;z-index:1}
.kpi .v small{font-size:13px;color:var(--faint);font-weight:500;letter-spacing:0;margin-left:5px}
.kpi .d{margin-top:9px;font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px;position:relative;z-index:1}
.kpi:has(.spark) .d{max-width:calc(100% - 96px)}
.kpi .d .up{color:var(--good);font-weight:600}
.kpi .spark{position:absolute;right:14px;bottom:14px;width:88px;height:34px}
.kpi .ic{position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(236,238,245,.05);border:1px solid var(--line);color:var(--dim);transition:transform .4s var(--spring),color .3s}
.kpi:hover .ic{transform:rotate(-8deg) scale(1.08);color:var(--paper)}
.kpi .ic svg{width:15px;height:15px}
.chart{width:100%;display:block;overflow:visible;position:relative;z-index:1;touch-action:pan-y}
.chart text{font-family:var(--mono)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--dim);position:relative;z-index:1}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px;vertical-align:-1px}
.empty{padding:26px 10px;text-align:center;color:var(--faint);font-size:13px;position:relative;z-index:1}
.tip{position:fixed;z-index:80;pointer-events:none;padding:10px 12px;border-radius:10px;background:rgba(8,9,14,.94);backdrop-filter:blur(10px);border:1px solid var(--line2);font-size:12px;line-height:1.55;box-shadow:0 16px 40px rgba(0,0,0,.6);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;white-space:nowrap;min-width:120px}
.tip.on{opacity:1;transform:none}
.tip b{color:var(--paper);font-weight:600}.tip span{color:var(--dim)}
.tip .tr{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tip .tr i{width:8px;height:8px;border-radius:2px;flex:none}
.tip .tr em{font-style:normal;margin-left:auto;padding-left:14px;font-family:var(--mono);color:var(--paper)}

.check{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--faint);display:grid;place-items:center;cursor:pointer;flex:none;background:transparent;transition:all .25s var(--spring)}

.done .t b{color:var(--faint);text-decoration:line-through}
.bar-in{height:6px;border-radius:999px;background:rgba(236,238,245,.06);overflow:hidden;position:relative}

<script>
(() => {

/* ═════════ data layer ═════════ */

async function api(path, method = 'GET', body) {
  const r = await fetch(API + path, { method, headers: { 'content-type': 'application/json', 'x-hq-key': KEY }, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || ('HTTP ' + r.status)); e.status = r.status; e.body = j; throw e; }
  return j;
}
async function load(quiet) {
  try {
    const j = await api('/hq/all');
    S = { cols: j.collections || {}, live: j.live || { pages: [], pageDays: {}, callDays: {} }, now: j.now };

}
const docs = col => Object.entries(S.cols[col] || {}).map(([id, d]) => ({ id, ...d.data, _v: d.v, _at: d.at }));
const doc = (col, id) => { const d = (S.cols[col] || {})[id]; return d ? { id, ...d.data, _v: d.v } : null; };
async function put(col, id, data) { await api(`/hq/c/${col}/${id}`, 'PUT', { data }); await load('soft'); }
async function patch(col, id, data) { await api(`/hq/c/${col}/${id}`, 'PATCH', { data }); await load('soft'); }

const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ═════════ helpers ═════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const eur = (n, d = 0) => (n < 0 ? '−' : '') + '€' + Math.abs(+n || 0).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
const nf = n => (+n || 0).toLocaleString('en-US');
const today = () => new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Riga' });
const addDays = (iso, n) => { const d = new Date(iso + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const dayLabel = iso => new Date(iso + 'T12:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
const wd = iso => new Date(iso + 'T12:00:00Z').toLocaleDateString('en-GB', { weekday: 'short' });
const ago = t => { if (!t) return ''; const s = (Date.now() - new Date(t)) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + ' min ago'; if (s < 86400) return Math.floor(s / 3600) + ' h ago'; return Math.floor(s / 86400) + ' d ago'; };
const rigaTime = t => new Date(t).toLocaleString('en-GB', { timeZone: 'Europe/Riga', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const sum = (a, f = x => x) => a.reduce((s, x) => s + (+f(x) || 0), 0);

function setSync(ok, why) { $('#syncDot').className = 'dot' + (ok ? ' live' : ' off'); $('#syncTxt').textContent = ok ? 'Synced ' + ago(lastSync) : (why || 'Offline'); }

function tickClock() {

  clients: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4-6"/>',
  tasks: '<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
  spark: '<path d="M12 3l2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"/>',

let palSel = 0, palList = [];
function openPal() { $('#palVeil').classList.add('on'); const i = $('#palIn'); i.value = ''; palSel = 0; drawPal(); setTimeout(() => i.focus(), 30); }
function drawPal() { const q = $('#palIn').value.toLowerCase(); palList = PAL().filter(o => o.l.toLowerCase().includes(q)).slice(0, 12); palSel = Math.max(0, Math.min(palSel, palList.length - 1)); $('#palOpts').innerHTML = palList.map((o, i) => `<div class="opt ${i === palSel ? 'on' : ''}" data-i="${i}">${esc(o.l)}</div>`).join(''); $('#palOpts').querySelectorAll('.opt').forEach(el => el.onclick = () => { $('#palVeil').classList.remove('on'); palList[+el.dataset.i].run(); }); }
$('#palIn').oninput = () => { palSel = 0; drawPal(); };
$('#palIn').onkeydown = e => { if (e.key === 'ArrowDown') { palSel = Math.min(palSel + 1, palList.length - 1); drawPal(); e.preventDefault(); } else if (e.key === 'ArrowUp') { palSel = Math.max(0, palSel - 1); drawPal(); e.preventDefault(); } else if (e.key === 'Enter' && palList[palSel]) { $('#palVeil').classList.remove('on'); palList[palSel].run(); } };
$('#palVeil').onclick = e => { if (e.target.id === 'palVeil') $('#palVeil').classList.remove('on'); };
$('#palBtn').onclick = openPal;
addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPal(); } if (e.key === 'Escape') { closeModal(); $('#palVeil').classList.remove('on'); } });

/* ═════════ intro / login / start ═════════ */
function intro() {
  const app = $('#app');
  const reveal = () => { app.classList.add('reveal'); setTimeout(() => app.classList.remove('reveal'), 1400); };
  if (REDUCE || ss.get('hq-intro')) return { done: () => {} };
  ss.set('hq-intro', '1');
  const el = $('#intro'), bar = $('#introBar'), pctEl = $('#introPct'), stepEl = $('#introStep'), logEl = $('#introLog'), title = $('#introTitle'), t0 = Date.now();
  el.classList.add('on');
  // title decodes from random characters
  const word = '2FOLD HQ', CH = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#%&*/<>';
  let fr = 0; const dec = setInterval(() => {
    fr++; const fixed = Math.floor((fr - 14) / 2.2);
    const s = [...word].map((c, i) => c === ' ' ? ' ' : i < fixed ? c : CH[Math.floor(Math.random() * CH.length)]).join('');
    title.innerHTML = esc(s.slice(0, 6)) + '<b>' + esc(s.slice(6)) + '</b>';
    if (fixed >= word.length) clearInterval(dec);
  }, 38);
  // boot counter + log lines
  const LOG = ['handshake → missed-call server', 'loading money', 'loading calls + leads', 'loading page visits', 'drawing charts', 'all systems go'];
  let pct = 0, target = 62, li = 0;
  const step = setInterval(() => {
    pct += Math.max(.4, (target - pct) * .08); if (pct > target) pct = target;
    pctEl.textContent = String(Math.round(pct)).padStart(3, '0') + '%'; bar.style.width = pct + '%';
    const want = Math.min(LOG.length - 1, Math.floor(pct / (100 / LOG.length)));
    if (want !== li || !logEl.textContent) { li = want; logEl.innerHTML = '<span style="color:var(--blue3)">›</span> ' + esc(LOG[li]); }
  }, 30);
  setTimeout(() => stepEl.textContent = 'SYNCING DATA', 900);
  let closed = false;
  const close = () => {
    if (closed) return; closed = true; target = 100; stepEl.textContent = 'READY';
    setTimeout(() => {
      clearInterval(dec); title.innerHTML = '2FOLD <b>HQ</b>';
      el.classList.add('open'); reveal();
      setTimeout(() => { clearInterval(step); el.classList.remove('on', 'open'); }, 1000);
    }, 380);
  };
  el.onclick = close;
  return { done: () => setTimeout(close, Math.max(0, 2700 - (Date.now() - t0))) };
}
function showLogin(err) { $('#app').classList.remove('on'); $('#login').style.display = 'grid'; $('#loginErr').textContent = err || ''; $('#apiIn').value = API; setTimeout(() => $('#keyIn').focus(), 50); }
$('#loginForm').onsubmit = async e => {
  e.preventDefault(); KEY = $('#keyIn').value.trim(); API = ($('#apiIn').value.trim() || DEFAULT_API).replace(/\/$/, '');
  $('#loginErr').textContent = 'Checking…';
  try { await api('/hq/all'); ls.set('hq-key', KEY); ls.set('hq-api', API === DEFAULT_API ? null : API); start(); }
  catch (err) { $('#loginErr').textContent = err.status === 403 ? 'Wrong key.' : 'Server not reachable.'; }
};
$('#logoutBtn').onclick = () => { ls.set('hq-key', null); KEY = ''; showLogin(); };
$('#refreshBtn').onclick = async () => { if (await load('soft')) toast('Up to date ✓'); };
async function start() {
  const it = intro();
  $('#login').style.display = 'none'; $('#app').classList.add('on');
  if (location.hash) page = location.hash.slice(1);
  await load(); it.done();
}
setInterval(() => { if (KEY && !document.hidden) load('soft'); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && KEY && Date.now() - lastSync > 20000) load('soft'); });
tickClock();
if (KEY) start(); else showLogin();
})();
</script>
