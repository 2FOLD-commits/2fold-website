<style>
:root{
  --ink:#06070B;--ink2:#0B0D14;--card:rgba(15,17,27,.72);--card2:rgba(22,25,38,.8);
  --line:rgba(243,241,234,.07);--line2:rgba(243,241,234,.13);
  --paper:#F3F1EA;--dim:#9BA0B4;--faint:#5F6478;
  --blue:#6E88FF;--blue2:#4259D9;--blue3:#A9B8FF;--mint:#3DDC97;--pink:#FF6AD5;--amber:#F5B544;--red:#FF5A5F;--violet:#A78BFA;
  --ease:cubic-bezier(.2,.7,.15,1);--r:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ink);color-scheme:dark}
body{font-family:'Archivo',system-ui,sans-serif;color:var(--paper);background:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
::selection{background:var(--blue);color:var(--ink)}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(50% 40% at 80% -5%,rgba(110,136,255,.18),transparent 70%),radial-gradient(40% 35% at -5% 105%,rgba(66,89,217,.16),transparent 70%),radial-gradient(30% 30% at 50% 50%,rgba(61,220,151,.04),transparent 70%)}
.bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(243,241,234,.06) 1px,transparent 1.2px);background-size:28px 28px;-webkit-mask-image:radial-gradient(80% 70% at 50% 30%,#000,transparent)}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
.num{font-variant-numeric:tabular-nums}

/* ── login ── */
#login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px}
#login .box{width:min(420px,100%);padding:38px 34px 30px;border-radius:28px;background:var(--card);border:1px solid var(--line2);backdrop-filter:blur(18px);box-shadow:0 40px 120px -30px rgba(0,0,0,.9),0 0 0 1px rgba(110,136,255,.08) inset;text-align:center}
#login svg.mark{width:64px;height:64px;filter:drop-shadow(0 8px 30px rgba(110,136,255,.55))}
#login h1{margin-top:18px;font-size:30px;letter-spacing:-.03em}
#login h1 span{color:var(--blue)}
#login p{margin-top:8px;color:var(--dim);font-size:14px}
#login input{margin-top:24px;width:100%;padding:15px 16px;border-radius:14px;border:1px solid var(--line2);background:rgba(0,0,0,.35);font-size:15px;outline:none;text-align:center;letter-spacing:.06em}
#login input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(110,136,255,.18)}
#login .go{margin-top:12px;width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--blue2));font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 12px 30px -10px rgba(110,136,255,.8)}
#login .err{margin-top:12px;color:var(--red);font-size:13px;min-height:18px}
#login details{margin-top:14px;font-size:12px;color:var(--faint);text-align:left}
#login details input{margin-top:8px;padding:10px;font-size:12px;text-align:left;letter-spacing:0}

/* ── shell ── */
#app{position:relative;z-index:1;display:none;min-height:100vh}
#app.on{display:grid;grid-template-columns:248px 1fr}
aside{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:rgba(8,9,14,.6);backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 22px}
.brand svg{width:36px;height:36px;filter:drop-shadow(0 4px 18px rgba(110,136,255,.6))}
.brand b{font-size:19px;letter-spacing:.02em}
.brand small{display:block;font-size:10.5px;letter-spacing:.28em;color:var(--faint);margin-top:2px}
nav.side a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--dim);text-decoration:none;font-size:14.5px;font-weight:500;transition:background .2s,color .2s;position:relative}
nav.side a svg{width:18px;height:18px;flex:none}
nav.side a:hover{background:rgba(243,241,234,.04);color:var(--paper)}
nav.side a.on{background:linear-gradient(90deg,rgba(110,136,255,.18),rgba(110,136,255,.02));color:var(--paper)}
nav.side a.on::before{content:"";position:absolute;left:-16px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--blue);box-shadow:0 0 12px var(--blue)}
nav.side a .badge{margin-left:auto;font-size:11px;padding:2px 7px;border-radius:999px;background:rgba(110,136,255,.18);color:var(--blue3)}
.side-foot{margin-top:auto;padding:12px;border-radius:14px;border:1px solid var(--line);background:rgba(0,0,0,.25);font-size:12px;color:var(--dim)}
.side-foot .row{display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint);flex:none}
.dot.off{background:var(--red);box-shadow:0 0 10px var(--red)}
.side-foot button{margin-top:10px;width:100%;padding:8px;border-radius:10px;border:1px solid var(--line2);background:transparent;color:var(--dim);cursor:pointer;font-size:12px}
.side-foot button:hover{color:var(--paper);border-color:var(--blue)}

main{min-width:0;padding:26px 34px 80px}
.top{display:flex;align-items:center;gap:16px;margin-bottom:26px}
.top h2{font-size:30px;letter-spacing:-.035em;font-weight:700}
.top .sub{color:var(--dim);font-size:13.5px;margin-top:3px}
.top .grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line2);background:rgba(243,241,234,.03);cursor:pointer;font-size:13.5px;font-weight:600;transition:transform .15s,border-color .2s,background .2s;white-space:nowrap}
.btn:hover{border-color:var(--blue);background:rgba(110,136,255,.08)}
.btn:active{transform:scale(.97)}
.btn.primary{border:0;background:linear-gradient(135deg,var(--blue),var(--blue2));box-shadow:0 10px 26px -10px rgba(110,136,255,.9)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.kbd{font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid var(--line2);color:var(--faint)}

/* ── cards ── */
.grid{display:grid;gap:16px}
.g6{grid-template-columns:repeat(6,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:span 4}.span6{grid-column:1/-1}
.card{position:relative;border-radius:var(--r);background:var(--card);border:1px solid var(--line);padding:18px 20px;backdrop-filter:blur(12px);overflow:hidden;animation:rise .6s var(--ease) both}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(140deg,rgba(110,136,255,.35),transparent 35%,transparent 70%,rgba(61,220,151,.18));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.6}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card h3{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:var(--faint);font-size:12px}
.kpi .v{margin-top:12px;font-size:34px;font-weight:700;letter-spacing:-.04em;line-height:1}
.kpi .v small{font-size:15px;color:var(--dim);font-weight:500;letter-spacing:0;margin-left:3px}
.kpi .d{margin-top:8px;font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:6px}
.kpi .d .up{color:var(--mint)}.kpi .d .down{color:var(--red)}
.kpi .spark{position:absolute;right:14px;bottom:12px;width:92px;height:34px;opacity:.9}
.kpi .ic{position:absolute;right:16px;top:16px;width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:rgba(110,136,255,.12);color:var(--blue3)}
.kpi .ic svg{width:18px;height:18px}
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:'Archivo',sans-serif}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--dim)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.empty{padding:26px 10px;text-align:center;color:var(--faint);font-size:13px}
.tip{position:fixed;z-index:80;pointer-events:none;padding:8px 11px;border-radius:10px;background:rgba(10,11,18,.95);border:1px solid var(--line2);font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.6);opacity:0;transition:opacity .12s;white-space:nowrap}
.tip b{color:var(--paper)}.tip span{color:var(--dim)}

/* ── lists / tables ── */
.list{margin-top:12px;display:flex;flex-direction:column;gap:2px}
.li{display:flex;align-items:center;gap:12px;padding:10px 10px;border-radius:12px;transition:background .15s}
.li:hover{background:rgba(243,241,234,.035)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t small{display:block;margin-top:2px;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.pill.mint{color:var(--mint);border-color:rgba(61,220,151,.35);background:rgba(61,220,151,.08)}
.pill.blue{color:var(--blue3);border-color:rgba(110,136,255,.35);background:rgba(110,136,255,.08)}
.pill.amber{color:var(--amber);border-color:rgba(245,181,68,.35);background:rgba(245,181,68,.08)}
.pill.red{color:var(--red);border-color:rgba(255,90,95,.35);background:rgba(255,90,95,.08)}
.pill.pink{color:var(--pink);border-color:rgba(255,106,213,.35);background:rgba(255,106,213,.08)}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px}
th{text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:hover td{background:rgba(243,241,234,.02)}
td.amt{text-align:right;font-weight:700}
.check{width:22px;height:22px;border-radius:7px;border:1.6px solid var(--faint);display:grid;place-items:center;cursor:pointer;flex:none;background:transparent;transition:all .2s}
.check.on{background:var(--mint);border-color:var(--mint);box-shadow:0 0 14px rgba(61,220,151,.5)}
.check.on::after{content:"";width:9px;height:5px;border-left:2.2px solid #06070B;border-bottom:2.2px solid #06070B;transform:rotate(-45deg) translate(1px,-1px)}
.done .t b{color:var(--faint);text-decoration:line-through}
.bar-in{height:7px;border-radius:999px;background:rgba(243,241,234,.06);overflow:hidden}
.bar-in i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue2),var(--blue));box-shadow:0 0 12px rgba(110,136,255,.6);transition:width 1s var(--ease)}

/* ── forms ── */
.form{display:grid;gap:10px;margin-top:12px}
.form .row{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.form label{font-size:11.5px;color:var(--dim);display:flex;flex-direction:column;gap:5px}
.form input,.form select,.form textarea{padding:10px 12px;border-radius:11px;border:1px solid var(--line2);background:rgba(0,0,0,.3);outline:none;font-size:13.5px}
.form input:focus,.form select:focus,.form textarea:focus{border-color:var(--blue)}
.form textarea{min-height:70px;resize:vertical}
.seg{display:inline-flex;padding:3px;border-radius:11px;border:1px solid var(--line2);background:rgba(0,0,0,.25)}
.seg button{padding:7px 12px;border:0;border-radius:8px;background:transparent;color:var(--dim);cursor:pointer;font-size:12.5px;font-weight:600}
.seg button.on{background:rgba(110,136,255,.2);color:var(--paper)}

/* ── kanban ── */
.kanban{display:grid;grid-template-columns:repeat(6,minmax(165px,1fr));gap:14px;overflow-x:auto;padding-bottom:10px}
.col{border-radius:18px;border:1px solid var(--line);background:rgba(10,12,19,.55);padding:12px;min-height:200px;transition:border-color .2s,background .2s}
.col.over{border-color:var(--blue);background:rgba(110,136,255,.06)}
.col h4{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:4px 4px 10px}
.col h4 i{width:8px;height:8px;border-radius:50%}
.col h4 span{margin-left:auto;color:var(--faint);letter-spacing:0}
.deal{padding:12px 13px;border-radius:14px;background:var(--card2);border:1px solid var(--line);margin-bottom:9px;cursor:grab;transition:transform .15s,border-color .2s}
.deal:hover{border-color:var(--line2);transform:translateY(-1px)}
.deal b{font-size:13.5px;display:block}
.deal small{display:block;color:var(--dim);font-size:11.5px;margin-top:3px}
.deal .meta{display:flex;align-items:center;gap:6px;margin-top:9px;flex-wrap:wrap}
.deal .sig{margin-top:8px;font-size:11.5px;color:var(--amber)}

/* ── modal, palette, toast ── */
.veil{position:fixed;inset:0;z-index:60;background:rgba(3,4,8,.6);backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;padding:10vh 16px}
.veil.on{display:flex}
.modal{width:min(520px,100%);border-radius:22px;background:#0D0F18;border:1px solid var(--line2);padding:22px;box-shadow:0 40px 120px rgba(0,0,0,.8);animation:rise .3s var(--ease)}
.modal h3{font-size:18px;letter-spacing:-.02em}
.modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#palette input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line2);background:rgba(0,0,0,.35);outline:none;font-size:15px}
#palette .opts{margin-top:10px;max-height:50vh;overflow:auto}
#palette .opt{padding:11px 12px;border-radius:11px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:14px;color:var(--dim)}
#palette .opt.on,#palette .opt:hover{background:rgba(110,136,255,.14);color:var(--paper)}
#toast{position:fixed;left:50%;bottom:26px;z-index:90;transform:translate(-50%,20px);opacity:0;transition:all .3s var(--ease);padding:12px 18px;border-radius:14px;background:#11131D;border:1px solid var(--line2);font-size:13.5px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ── hero ── */
.hero{display:flex;align-items:flex-end;gap:18px;margin-bottom:22px;flex-wrap:wrap}
.hero h1{font-size:40px;letter-spacing:-.045em;line-height:1}
.hero h1 em{font-style:normal;background:linear-gradient(100deg,var(--blue3),var(--blue) 50%,var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--dim);font-size:14px;margin-top:8px}
.ring-wrap{display:flex;align-items:center;gap:18px;margin-top:10px}
.ring-wrap .big{font-size:42px;font-weight:700;letter-spacing:-.04em}
.count-days{font-size:12px;color:var(--dim)}

@media (max-width:1300px){.g6{grid-template-columns:repeat(3,1fr)}}
@media (max-width:1000px){
  #app.on{grid-template-columns:1fr}
  aside{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;z-index:40;flex-direction:row;padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);overflow-x:auto}
  .brand,.side-foot{display:none}
  nav.side{display:flex;gap:4px}
  nav.side a{flex-direction:column;gap:4px;font-size:10.5px;padding:8px 10px}
  nav.side a.on::before{display:none}
  nav.side a .badge{display:none}
  main{padding:18px 16px 110px}
  .g4,.g3,.g2{grid-template-columns:1fr}.g6{grid-template-columns:repeat(2,1fr)}
  .span2,.span3,.span4{grid-column:auto}
  .top h2{font-size:24px}.hero h1{font-size:30px}
  .top .hide-m{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"></div>

<!-- login -->
<div id="login">
  <form class="box" id="loginForm" autocomplete="off">
    <svg class="mark" viewBox="0 0 100 100"><path d="M30.87 22 L69.13 22 L57.47 33.67 L30.87 33.67 Z" fill="#6E88FF"/><path d="M69.13 22 L69.13 55.83 L57.47 44.17 L57.47 33.67 Z" fill="#4259D9"/><path d="M57.47 44.17 L69.13 55.83 L42.53 55.83 L30.87 44.17 Z" fill="#6E88FF"/><path d="M30.87 44.17 L42.53 55.83 L42.53 66.33 L30.87 78 Z" fill="#4259D9"/><path d="M42.53 66.33 L69.13 66.33 L69.13 78 L30.87 78 Z" fill="#6E88FF"/></svg>
    <h1>2FOLD <span>HQ</span></h1>
    <p>Private. Enter your HQ key to continue.</p>
    <input id="keyIn" type="password" placeholder="HQ key" autocomplete="current-password">
    <button class="go" type="submit">Enter HQ</button>
    <div class="err" id="loginErr"></div>
    <details><summary>Server</summary><input id="apiIn" type="text" spellcheck="false"></details>
  </form>
</div>

<div id="app">
  <aside>
    <div class="brand">
      <svg viewBox="0 0 100 100"><path d="M30.87 22 L69.13 22 L57.47 33.67 L30.87 33.67 Z" fill="#6E88FF"/><path d="M69.13 22 L69.13 55.83 L57.47 44.17 L57.47 33.67 Z" fill="#4259D9"/><path d="M57.47 44.17 L69.13 55.83 L42.53 55.83 L30.87 44.17 Z" fill="#6E88FF"/><path d="M30.87 44.17 L42.53 55.83 L42.53 66.33 L30.87 78 Z" fill="#4259D9"/><path d="M42.53 66.33 L69.13 66.33 L69.13 78 L30.87 78 Z" fill="#6E88FF"/></svg>
      <div><b>2FOLD HQ</b><small>COMMAND CENTER</small></div>
    </div>
    <nav class="side" id="nav"></nav>
    <div class="side-foot">
      <div class="row"><span class="dot" id="syncDot"></span><span id="syncTxt">Connecting…</span></div>
      <button id="refreshBtn">Refresh now</button>
      <button id="logoutBtn">Log out</button>
    </div>
  </aside>
  <main>
    <div class="top">
      <div><h2 id="pageTitle">Overview</h2><div class="sub" id="pageSub"></div></div>
      <div class="grow"></div>
      <button class="btn hide-m" id="palBtn">Search <span class="kbd">Ctrl K</span></button>
      <button class="btn primary" id="addBtn">+ Add</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="veil" id="modalVeil"><div class="modal" id="modal"></div></div>
<div class="veil" id="palVeil"><div class="modal" id="palette"><input id="palIn" placeholder="Jump to… or type an action (task, money, deal)"><div class="opts" id="palOpts"></div></div></div>
<div class="tip" id="tip"></div>
<div id="toast"></div>

<script>
(() => {
'use strict';

const DEFAULT_API = 'https://missed-call-production-1689.up.railway.app';

    return `<div class="card ${span}"><h3>${esc(w.title)}</h3><div style="margin-top:10px;color:var(--dim);font-size:14px;line-height:1.55;white-space:pre-wrap">${esc(w.text || '')}</div></div>`;

}

  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h3>By niche <span class="r">sent → read → replies</span></h3>${niches.length ? `<table><tr><th>Niche</th><th>Sent</th><th></th><th>Read</th><th>Replies</th><th>Season</th></tr>${niches.map(n => `<tr><td><b>${esc(n.name)}</b></td><td class="num">${nf(n.sent)}</td><td style="width:22%"><div class="bar-in"><i style="width:${100 * (n.sent || 0) / maxS}%"></i></div></td><td class="num">${n.read != null ? nf(n.read) : '–'}</td><td class="num">${nf(n.replies)}</td><td>${n.season ? `<span class="pill ${n.season === 'hot' ? 'pink' : n.season === 'warm' ? 'amber' : ''}">${esc(n.season)}</span>` : ''}</td></tr>`).join('')}</table>` : '<div class="empty">No niche data yet.</div>'}</div>
    <div class="card"><h3>Page visits <span class="r">live · ${V.length}</span></h3><div class="list" style="max-height:420px;overflow:auto">${V.map(p => `<div class="li"><span class="dot" style="background:${p.engaged ? '#F5B544' : '#5F6478'};box-shadow:none"></span><div class="t"><b>${esc(p.name)}</b><small>${esc(p.trade)} · ${esc(rigaTime(p.last))}</small></div><span class="pill">${p.open}× open</span>${p.engaged ? '<span class="pill amber">read</span>' : ''}${p.calc ? '<span class="pill blue">calc</span>' : ''}${p.yes ? '<span class="pill mint">YES</span>' : ''}</div>`).join('') || '<div class="empty">No visits yet.</div>'}</div></div>
  </div>${widgetsFor('outreach')}`;
};
AFTER.outreach = v => v.querySelectorAll('[data-plan]').forEach(b => b.onclick = async () => { const p = doc('plan', b.dataset.plan); const rounds = (p.rounds || []).map((r, i) => i === +b.dataset.i ? { ...r, done: !r.done } : r); await patch('plan', p.id, { rounds }); });

const CALL_ST = [['', 'To call', ''], ['JĀ', 'YES', 'mint'], ['INFO', 'Info', 'blue'], ['ATZVANĪT', 'Call back', 'amber'], ['NEATBILD', 'No answer', ''], ['NĒ', 'No', 'red'], ['NEDARBOJAS', 'Dead', 'red']];
VIEWS.calls = () => {
  const f = ls.get('hq-callf') || 'todo', q = (ls.get('hq-callq') || '').toLowerCase();
  const first = ((doc('meta', 'main') || {}).callFirst || []).map(Number);
  let calls = docs('calls').map(c => ({ ...c, st: (c.status || '').toUpperCase() === 'NEW' ? '' : (c.status || '').toUpperCase() }));
  const counts = Object.fromEntries(CALL_ST.map(([k]) => [k, calls.filter(c => c.st === k).length]));
  if (f === 'todo') calls = calls.filter(c => !c.st || c.st === 'NEATBILD' || c.st === 'ATZVANĪT'); else if (f !== 'all') calls = calls.filter(c => c.st === f);
  if (q) calls = calls.filter(c => (c.business + ' ' + c.trade + ' ' + c.phone).toLowerCase().includes(q));
  calls.sort((a, b) => { const fa = first.indexOf(+a.nr), fb = first.indexOf(+b.nr); return (fa < 0 ? 999 : fa) - (fb < 0 ? 999 : fb) || (+a.nr - +b.nr); });
  return `<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px"><div class="seg" id="callSeg">${[['todo', 'To do'], ['all', 'All'], ...CALL_ST.slice(1).map(s => [s[0], s[1]])].map(([k, l]) => `<button class="${f === k ? 'on' : ''}" data-f="${esc(k)}">${l}${k !== 'todo' && k !== 'all' ? ` ${counts[k] || 0}` : ''}</button>`).join('')}</div><input id="callQ" placeholder="Search…" value="${esc(q)}" style="padding:9px 12px;border-radius:11px;border:1px solid var(--line2);background:rgba(0,0,0,.3);outline:none;min-width:200px"></div>
  <div class="card"><h3>${calls.length} businesses <span class="r">★ = call first</span></h3><div class="list">${calls.slice(0, 150).map(c => `<div class="li" style="align-items:flex-start;flex-wrap:wrap"><div class="t" style="min-width:220px"><b>${first.includes(+c.nr) ? '<span style="color:var(--amber)">★ </span>' : ''}${esc(c.nr)}. ${esc(c.business)}</b><small>${esc(c.trade)} · <a href="tel:${esc(String(c.phone).replace(/\s/g, ''))}" style="color:var(--blue3)">${esc(c.phone)}</a>${c.calledOn ? ' · called ' + esc(c.calledOn) : ''}</small>${c.why ? `<small style="white-space:normal;color:var(--faint);margin-top:4px">${esc(c.why)}</small>` : ''}${c.note ? `<small style="white-space:normal;color:var(--amber);margin-top:4px">${esc(c.note)}</small>` : ''}</div><div style="display:flex;gap:5px;flex-wrap:wrap">${CALL_ST.slice(1).map(([k, l, col]) => `<button class="btn sm" style="${c.st === k ? `border-color:var(--${col || 'blue'});background:rgba(110,136,255,.12)` : ''}" data-call="${c.id}" data-st="${esc(k)}">${l}</button>`).join('')}<button class="btn sm" data-note="${c.id}">note</button></div></div>`).join('') || '<div class="empty">Nothing here.</div>'}</div></div>`;
};
AFTER.calls = v => {
  v.querySelectorAll('#callSeg button').forEach(b => b.onclick = () => { ls.set('hq-callf', b.dataset.f); render(); });
  const q = v.querySelector('#callQ'); q.oninput = () => { ls.set('hq-callq', q.value); clearTimeout(q.t); q.t = setTimeout(() => { render(); const n = $('#callQ'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 250); };
  v.querySelectorAll('[data-call]').forEach(b => b.onclick = async () => { await patch('calls', b.dataset.call, { status: b.dataset.st, calledOn: today(), updatedAt: new Date().toISOString(), by: 'HQ' }); toast('Saved: ' + b.textContent); });
  v.querySelectorAll('[data-note]').forEach(b => b.onclick = async () => { const c = doc('calls', b.dataset.note); const n = prompt('Note for ' + c.business, c.note || ''); if (n != null) await patch('calls', c.id, { note: n }); });
};

VIEWS.clients = () => {
  const M = money();
  return `<div class="grid g4">${kpi('Active clients', M.clients.filter(c => c.status === 'active').length, { ic: 'clients', color: '#3DDC97' })}${kpi('On free week', M.clients.filter(c => c.status === 'trial').length, { ic: 'spark' })}${kpi('MRR', M.mrr, { pre: '€', ic: 'money', color: '#3DDC97' })}${kpi('Avg / client', M.clients.filter(c => c.status === 'active').length ? M.mrr / M.clients.filter(c => c.status === 'active').length : 0, { pre: '€', ic: 'money' })}</div>
  <div class="grid g3" style="margin-top:16px">${M.clients.map(c => `<div class="card"><h3>${esc(c.trade || 'client')} <span class="r"><span class="pill ${c.status === 'active' ? 'mint' : c.status === 'trial' ? 'blue' : 'red'}">${esc(c.status)}</span></span></h3><div style="font-size:22px;font-weight:700;margin-top:10px;letter-spacing:-.02em">${esc(c.name)}</div><div style="color:var(--dim);font-size:13px;margin-top:4px">since ${esc(c.since ? dayLabel(c.since) : '–')}${c.founding ? ' · founding client' : ''}</div><div class="kpi"><div class="v num" style="font-size:28px">${eur(c.monthly)}<small>/mo</small></div></div><div class="legend">${(c.tools || []).map(t => `<span class="pill blue">${esc(t)}</span>`).join('')}</div></div>`).join('') || `<div class="card span3"><div class="empty" style="padding:50px 10px"><div style="font-size:40px">🚀</div><div style="margin-top:10px;font-size:16px;color:var(--paper)">First client is coming.</div><div style="margin-top:6px">When someone signs, press <b>+ Add → Client</b>, or tell Claude.</div></div></div>`}</div>${widgetsFor('clients')}`;
};
function clientModal() {
  openModal(`<h3>New client</h3><form class="form" id="clientForm"><div class="row"><label>Name<input name="name" required></label><label>Trade<input name="trade"></label></div>
  <div class="row"><label>Monthly €<input name="monthly" type="number" value="99"></label><label>Setup €<input name="setup" type="number" value="0"></label></div>
  <div class="row"><label>Status<select name="status"><option value="trial">Free week</option><option value="active">Active</option><option value="paused">Paused</option><option value="lost">Lost</option></select></label><label>Since<input name="since" type="date" value="${today()}"></label></div>
  <label>Tools (comma separated)<input name="tools" placeholder="AI phone, text-back"></label><label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" name="founding" checked> Founding client</label>
  <div class="actions"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">Save</button></div></form>`);
  const f = $('#clientForm');
  f.onsubmit = async e => { e.preventDefault(); const x = Object.fromEntries(new FormData(f)); x.monthly = +x.monthly || 0; x.setup = +x.setup || 0; x.founding = !!x.founding; x.tools = (x.tools || '').split(',').map(s => s.trim()).filter(Boolean); await put('clients', uid('c'), x); closeModal(); toast('Client added 🎉'); };
}

VIEWS.tasks = () => {
  const all = docs('tasks').sort((a, b) => String(a.due || '9').localeCompare(String(b.due || '9')));
  const t = today(), groups = [['Overdue', all.filter(x => !x.done && x.due && x.due < t)], ['Today', all.filter(x => !x.done && x.due === t)], ['Coming up', all.filter(x => !x.done && (!x.due || x.due > t))], ['Done', all.filter(x => x.done).slice(-15).reverse()]];
  return `<div class="grid g3"><div class="span2">${groups.map(([g, list]) => list.length ? `<div class="card" style="margin-bottom:16px"><h3>${g} <span class="r">${list.length}</span></h3><div class="list">${list.map(x => `<div class="li ${x.done ? 'done' : ''}"><button class="check ${x.done ? 'on' : ''}" data-t="${x.id}"></button><div class="t"><b>${esc(x.title)}</b><small>${x.due ? esc(wd(x.due) + ' ' + dayLabel(x.due)) : 'no date'}${x.time ? ' · ' + esc(x.time) : ''}${x.area ? ' · ' + esc(x.area) : ''}</small></div><button class="btn sm" data-tdel="${x.id}">✕</button></div>`).join('')}</div></div>` : '').join('') || '<div class="card"><div class="empty">No tasks.</div></div>'}</div>
  <div class="card" style="align-self:start"><h3>Add task</h3><form class="form" id="taskForm"><label>Task<input name="title" required></label><div class="row"><label>Date<input name="due" type="date" value="${t}"></label><label>Time<input name="time" placeholder="16:00"></label></div><label>Area<select name="area"><option>calls</option><option>email</option><option>content</option><option>partners</option><option>admin</option></select></label><button class="btn primary">Add</button></form></div></div>${widgetsFor('tasks')}`;
};
AFTER.tasks = v => {
  v.querySelectorAll('[data-t]').forEach(b => b.onclick = async () => { const x = doc('tasks', b.dataset.t); await patch('tasks', x.id, { done: !x.done, doneAt: x.done ? null : today() }); });
  v.querySelectorAll('[data-tdel]').forEach(b => b.onclick = async () => { await del('tasks', b.dataset.tdel); toast('Deleted'); });
  const f = v.querySelector('#taskForm'); f.onsubmit = async e => { e.preventDefault(); await put('tasks', uid('t'), { ...Object.fromEntries(new FormData(f)), done: false }); toast('Task added'); };
};

/* ═════════ modal, add menu, palette ═════════ */
function openModal(html) { $('#modal').innerHTML = html; $('#modalVeil').classList.add('on'); $('#modal').querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal); const i = $('#modal input'); if (i) setTimeout(() => i.focus(), 50); }
function closeModal() { $('#modalVeil').classList.remove('on'); }
$('#modalVeil').onclick = e => { if (e.target.id === 'modalVeil') closeModal(); };
function addMenu() {
  openModal(`<h3>Add</h3><div class="list" style="margin-top:10px">${[['task', 'Task', 'tasks'], ['money', 'Money entry', 'money'], ['deal', 'Deal / lead', 'pipeline'], ['client', 'Client', 'clients']].map(([k, l, ic]) => `<div class="li" style="cursor:pointer" data-add="${k}">${ico(ic)}<div class="t"><b>${l}</b></div></div>`).join('')}</div>`);
  $('#modal').querySelectorAll('[data-add]').forEach(el => el.onclick = () => doAdd(el.dataset.add));
}
function doAdd(k) {
  if (k === 'deal') return dealModal(null);
  if (k === 'client') return clientModal();
  if (k === 'money') { closeModal(); go('money'); return setTimeout(() => $('#moneyForm input[name=label]').focus(), 100); }
  closeModal(); go('tasks'); setTimeout(() => $('#taskForm input[name=title]').focus(), 100);
}
$('#addBtn').onclick = addMenu;
const PAL = () => [...PAGES.map(([id, l]) => ({ l: 'Go to ' + l, run: () => go(id) })), { l: 'Add task', run: () => doAdd('task') }, { l: 'Add money entry', run: () => doAdd('money') }, { l: 'Add deal', run: () => doAdd('deal') }, { l: 'Add client', run: () => doAdd('client') }, { l: 'Refresh data', run: () => load() },
  ...docs('deals').map(d => ({ l: 'Deal: ' + d.name, run: () => { go('pipeline'); dealModal(d); } })), ...docs('calls').map(c => ({ l: 'Call: ' + c.business, run: () => { ls.set('hq-callf', 'all'); ls.set('hq-callq', c.business); go('calls'); } }))];
let palSel = 0, palList = [];
function openPal() { $('#palVeil').classList.add('on'); const i = $('#palIn'); i.value = ''; drawPal(); setTimeout(() => i.focus(), 30); }
function drawPal() { const q = $('#palIn').value.toLowerCase(); palList = PAL().filter(o => o.l.toLowerCase().includes(q)).slice(0, 12); palSel = Math.min(palSel, palList.length - 1); $('#palOpts').innerHTML = palList.map((o, i) => `<div class="opt ${i === palSel ? 'on' : ''}" data-i="${i}">${esc(o.l)}</div>`).join(''); $('#palOpts').querySelectorAll('.opt').forEach(el => el.onclick = () => { $('#palVeil').classList.remove('on'); palList[+el.dataset.i].run(); }); }
$('#palIn').oninput = () => { palSel = 0; drawPal(); };
$('#palIn').onkeydown = e => { if (e.key === 'ArrowDown') { palSel = Math.min(palSel + 1, palList.length - 1); drawPal(); e.preventDefault(); } else if (e.key === 'ArrowUp') { palSel = Math.max(0, palSel - 1); drawPal(); e.preventDefault(); } else if (e.key === 'Enter' && palList[palSel]) { $('#palVeil').classList.remove('on'); palList[palSel].run(); } };
$('#palVeil').onclick = e => { if (e.target.id === 'palVeil') $('#palVeil').classList.remove('on'); };
$('#palBtn').onclick = openPal;
addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPal(); } if (e.key === 'Escape') { closeModal(); $('#palVeil').classList.remove('on'); } });

/* ═════════ login / start ═════════ */
function showLogin(err) { $('#app').classList.remove('on'); $('#login').style.display = 'grid'; $('#loginErr').textContent = err || ''; $('#apiIn').value = API; setTimeout(() => $('#keyIn').focus(), 50); }
$('#loginForm').onsubmit = async e => {
  e.preventDefault(); KEY = $('#keyIn').value.trim(); API = ($('#apiIn').value.trim() || DEFAULT_API).replace(/\/$/, '');
  $('#loginErr').textContent = 'Checking…';
  try { await api('/hq/all'); ls.set('hq-key', KEY); ls.set('hq-api', API === DEFAULT_API ? null : API); start(); }
  catch (err) { $('#loginErr').textContent = err.status === 403 ? 'Wrong key.' : 'Server not reachable.'; }
};
$('#logoutBtn').onclick = () => { ls.set('hq-key', null); KEY = ''; showLogin(); };
$('#refreshBtn').onclick = async () => { if (await load()) toast('Up to date'); };
async function start() { $('#login').style.display = 'none'; $('#app').classList.add('on'); if (location.hash) page = location.hash.slice(1); await load(); }
setInterval(() => { if (KEY && !document.hidden) load(true); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && KEY && Date.now() - lastSync > 20000) load(true); });
if (KEY) start(); else showLogin();
})();
</script>
</body>
</html>
